This changes several things.

The shapes are now different widths. For example, this one is relatively thin:

<path d='M300 -80 L395 20 L485 -30 L575 65 L510 175 L425 105 L340 190 L250 85 Z'/>

while this one is much thicker:

<path d='M-130 590 L25 525 L105 625 L215 565 L350 650 L270 730 L145 675 L50 770 L-90 690 Z'/>

They also have different lengths and more varied jagged edges.

One important point: you currently have transform='rotate(25 500 700)'. If you want the pattern closer to the 45 degree angle you originally mentioned, change that in both masks from:

transform='rotate(25 500 700)'

to:

transform='rotate(45 500 700)'

So your opening tag in both masks becomes:

%3Cg fill='white' filter='url(%23soft)' transform='rotate(45 500 700)'%3E

I would make that rotation change at the same time as the new shapes.

The blur stays at:

stdDeviation='14'

so you keep the soft fading edges that are working now.

also the line that starts with "-webkit-mask-image:url("data:image" is just one giant long line. also the second one that starts with "mask-image:url("data:image" is too. can i make them not one giant line? i cant edit them until then 

Yes. Those are giant because the entire SVG is embedded inside the CSS url("data:image/svg+xml,..."). You can make them much easier to edit by moving the SVG into separate files.

For example, instead of this:

-webkit-mask-image:url("data:image/svg+xml,%3Csvg ... %3E...%3C/svg%3E");

you can have:

-webkit-mask-image:url("../images/surge-mask.svg");
mask-image:url("../images/surge-mask.svg");

Then the actual SVG paths can be formatted normally across dozens of lines:

This is actually a much better way to build your Surge Foil because you can edit the shapes directly without dealing with the URL encoded %3C, %3E, %23, etc.

The only catch is that you need to create the SVG file in your repository. For your project, I would recommend:

fallout-mtg-collection/
├── css/
│   ├── terminal.css
│   ├── standard-foil.css
│   ├── rainbow-foil.css
│   └── surge-foil.css
│
├── images/
│   └── surge-mask.svg
│
└── html/
    └── deal-hunter.html

Then surge-foil.css can simply contain:

-webkit-mask-image:url("../images/surge-mask.svg");
mask-image:url("../images/surge-mask.svg");

This will make the Surge Foil dramatically easier to edit.

If you want, I can give you the 
exact complete surge-foil.css and surge-mask.svg files, using the irregular 45 degree shapes we were working on, so you can just create the two files and paste them in.

okay i created surge-mask.svg in the location "images/surge-mask.svg"  what do i need to paste into the code

Since surge-mask.svg is now at:

images/surge-mask.svg

you can remove the two giant embedded SVG lines from surge-foil.css and replace them with a normal file reference.

Find these two lines:

-webkit-mask-image:url("data:image/svg+xml,...");
mask-image:url("data:image/svg+xml,...");

Replace both of them with:

-webkit-mask-image:url("../images/surge-mask.svg");
mask-image:url("../images/surge-mask.svg");

So that section of your surge-foil.css should look like this:

/*
 * ----------------------------------------------------
 * ZEBRA MASK
 * ----------------------------------------------------
 *
 * White = rainbow
 * Black = original card
 */

-webkit-mask-image:url("../images/surge-mask.svg");
mask-image:url("../images/surge-mask.svg");

-webkit-mask-repeat:no-repeat;
mask-repeat:no-repeat;

-webkit-mask-size:100% 100%;
mask-size:100% 100%;

animation:
    surgeFoilColors 8s linear infinite;

Then put this entire code into images/surge-mask.svg:

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1400">
    <defs>
        <filter id="soft">
            <feGaussianBlur stdDeviation="14"/>
        </filter>
    </defs>

    <g
        fill="white"
        filter="url(#soft)"
        transform="rotate(45 500 700)"
    >

