Yes. You do not need to change the whole CSS. The easiest way is to change the individual <path> shapes inside the SVG. Right now they are all roughly the same thickness and arranged in a regular grid.

Since your current mask is working, I would make the shapes more varied while leaving the blur, mask, opacity, and animation alone.

There are two identical SVG sections in your CSS, one for -webkit-mask-image and one for mask-image. You need to make the same replacement in both.

