The important part is that the SVG file contains only the mask shapes. Your surge-foil.css contains the rainbow colors and animation, while surge-mask.svg controls the actual zebra pattern.

Also, because surge-foil.css is inside css/, this path:

../images/surge-mask.svg

is correct.
